name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions: 
      contents: read #to check out the code
      packages: write #to push to the registry
      id-token: write #Which it lets the runner request a short lived OIDC identity, the identity is what sigstore issues the signing certificate against
      attestations: write #to store the signature
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/vicjustine/berthforge:${{ github.ref_name }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/vicjustine/berthforge
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
